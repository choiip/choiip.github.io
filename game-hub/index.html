<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Hub</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <div id="hub-screen">
            <h1>🎮 Game Hub</h1>
            <div class="game-grid">
                <div class="game-card" data-game="snake">
                    <div class="game-icon">🐍</div>
                    <h3>Snake</h3>
                    <p>Classic snake game. Eat food to grow!</p>
                    <button class="start-btn">Play Now</button>
                </div>
                <div class="game-card" data-game="tetris">
                    <div class="game-icon">🧱</div>
                    <h3>Tetris</h3>
                    <p>Clear lines to score points!</p>
                    <button class="start-btn">Play Now</button>
                </div>
            </div>
        </div>

        <div id="game-screen" class="hidden">
            <button id="back-to-hub">⬅ Back to Hub</button>
            <div id="game-container">
                <!-- Game canvas and UI will be injected here -->
            </div>
        </div>
    </div>
    <script src="js/hub.js"></script>
</body>
</html>
